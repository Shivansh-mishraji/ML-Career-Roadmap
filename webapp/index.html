<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>webapp</title>
  </head>
  <body style="margin: 0; padding: 0; background: #02020A; display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div id="root">
      <style>
        .initial-loader {
          width: 48px;
          height: 48px;
          border: 3px solid rgba(77, 159, 255, 0.1);
          border-radius: 50%;
          border-top-color: #00E5FF;
          animation: spin 1s ease-in-out infinite;
          box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div class="initial-loader"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
